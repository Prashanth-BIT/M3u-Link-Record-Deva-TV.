name: Devatv Stream Recorder (Stop & Upload)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp

      - name: Record Stream and Upload on Stop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAM_URL: "https://play.applelive.in/devatv/devatv.m3u8"
        run: |
          python3 - <<'EOF'
          import os
          import subprocess
          import requests
          import sys
          
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          stream_url = os.environ.get("STREAM_URL")
          
          output_file = "devatv_recording.mp4"
          process = None
          
          try:
              print("Starting stream recording... (Cancel anytime to upload current video)")
              cmd = [
                  "ffmpeg", "-i", stream_url, 
                  "-t", "14400", 
                  "-c", "copy", 
                  "-progress", "pipe:1", 
                  output_file
              ]
              
              process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, universal_newlines=True)
              
              for line in process.stdout:
                  if "time=" in line or "total_size=" in line:
                      sys.stdout.write(line)
                      sys.stdout.flush()
                      
              process.wait()
              
          except KeyboardInterrupt:
              print("Process interrupted by user.")
          finally:
              # நீங்கள் ஸ்டாப் செய்தாலும் அல்லது ரெக்கார்டிங் முடிந்தாலும் இந்தப் பகுதி இயங்கும்
              if process and process.poll() is None:
                  print("Stopping FFmpeg process...")
                  process.terminate()
                  process.wait()
              
              # வீடியோ ஃபைல் உள்ளதா மற்றும் காலியாக இல்லையா என சோதித்து டெலிகிராமிற்கு அனுப்புதல்
              if os.path.exists(output_file) and os.path.getsize(output_file) > 0:
                  print("Uploading recorded video to Telegram...")
                  url = f"https://api.telegram.org/bot{bot_token}/sendDocument"
                  
                  with open(output_file, "rb") as f:
                      files = {"document": f}
                      data = {"chat_id": chat_id, "caption": "Devatv Stream Recording (Stopped & Uploaded)!"}
                      response = requests.post(url, data=data, files=files)
                      
                  if response.status_code == 200:
                      print("Successfully uploaded to Telegram!")
                  else:
                      print(f"Failed to upload: {response.text}")
              else:
                  print("No video file found to upload.")
          EOF
